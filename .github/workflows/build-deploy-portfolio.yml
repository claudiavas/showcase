name: Build and Deploy Portfolio

on:
  push:
    branches: [main]
    paths:
      - "portfolio-dev/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: portfolio-dev/package-lock.json

      - name: Install dependencies
        working-directory: portfolio-dev
        run: npm ci

      - name: Build
        working-directory: portfolio-dev
        env:
          CI: false
          REACT_APP_EMAILJS_PUBLIC_KEY: ${{ secrets.REACT_APP_EMAILJS_PUBLIC_KEY }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio-dev/build

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
